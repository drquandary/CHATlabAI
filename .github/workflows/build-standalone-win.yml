name: Build Windows standalone

# Builds the one-click Windows installer: a small CHATLabAI-win.exe that embeds
# the repo + first-run script. On the user's machine it downloads the prebuilt
# Windows environment from Google Drive, unpacks it, prompts once for the PARCC
# key, and launches CHATLabAI. Uploaded as a private workflow artifact.
#
# The installer stays small (repo only), so NSIS builds it with no size trouble.
# The job also SMOKE-TESTS the real flow on the Windows runner — download the
# env from Drive, unpack, conda-unpack, `pi --version` — so we know it works.
#
# Run it: Actions → "Build Windows standalone" → Run workflow.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the installer payload
        shell: bash
        run: |
          mkdir -p build
          mkdir -p data projects
          cp packaging/standalone/setup-win.ps1 build/
          cp packaging/standalone/chatlab.nsi   build/
          tar -czf build/repo.tar.gz \
            --exclude='.git' --exclude='.venv' --exclude='packaging/dist' \
            --exclude='.cache' --exclude='.pi/.cache' --exclude='.claude' \
            bin .pi AGENTS.md README.md knowledge references calendar packaging data projects

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build the installer exe
        shell: pwsh
        run: |
          Push-Location build
          & "C:\Program Files (x86)\NSIS\makensis.exe" chatlab.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          if (-not (Test-Path CHATLabAI-win.exe)) { throw "installer exe not produced" }
          Get-Item CHATLabAI-win.exe | Format-List Name,Length
          Pop-Location

      - name: Smoke-test the real flow (download env from Drive + pi --version)
        shell: pwsh
        run: |
          $env:CHATLAB_SMOKE = '1'
          $env:PARCC_API_KEY = 'dummy-key-for-smoke'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File build/setup-win.ps1
          if ($LASTEXITCODE -ne 0) { throw "setup-win smoke test failed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHATLabAI-win
          path: build/CHATLabAI-win.exe
          if-no-files-found: error
          retention-days: 14
